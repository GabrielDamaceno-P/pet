<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="./css/cadastro.css">
</head>

<body>

  <form method="post" action="cadastrar.php" enctype="multipart/form-data">
    <div class="container">
      <div class="cadastro-form">
        <fieldset>
          
          <p>
          <h2>Cadastro</h2>
          </p><!-- Esse é um titulo-->
          <input type="text" id="nome_usuario" name="nome_usuario" placeholder="Nome"><br><br>
          <input type="text" id="endereco" name="endereco" placeholder="Endereço">
          <input type="tel" id="telefone" name="telefone" placeholder="(99)9999-9999">
          <input type="email" id="email" name="email" placeholder="email" >
          <input type="password" id="senha" name="senha" placeholder="senha" >
          <input type="password" id="senha" name="senha" placeholder="Confirma senha" >
        </fieldset>
        <br>
        <br>

          <fieldset>
          <p>
          <h2>Cadastro do Pet</h2>
          </p>
          <p>

            
          </p>
          <label>Nome do Pet:</label><br>
          <input type="text" placeholder="Nome do Pet"><br>
          <div id="pets-container"> 
            
            <div class="pet-block">


              <label>Sexo do Pet</label>
              <label><input type="radio" id="macho" name="sexo" value="macho">Macho</label>
              <label><input type="radio" id="femea" name="sexo" value="femea">Femea</label>

              <label>Porte do Pet</label>
              <label><input type="radio" id="pequeno" name="porte" value="pequeno">Pequeno</label>
              <label><input type="radio" id="medio" name="porte" value="medio">medio</label>
              <label><input type="radio" id="grande" name="porte" value="medio">Grande</label>

              <select id="raca">
                <option value="" disabled selected hidden>Escreva a raça</option>
                <option value="raca-do-amor">Raça do amor</option>
                <option value="labrador">Labrador</option>
                <option value="poodle">Poodle</option>
    
              </select></br> </br>

              <div id="pets"></div>
              <button type="submit">Cadastrar</button>
              <button type="reset">Limpar</button>
              <button type="button " onclick="adicionarPet()">Adicionar PET</button>
        
        
            </fieldset>
      </div> 
    </div>
  </div>
</div>
 
  </form>

</body>
<script>
  let contadorPets = 1
  function adicionarPet(){
    const container = document.getElementById('pets-container')
    const pets = document.getElementById('pets')
    const blocos = container.getElementsByClassName('pet-block');
    const ultimoBloco = blocos[blocos.length - 1];
    const novoBloco = ultimoBloco.cloneNode(true)
    novoBloco.querySelectorAll('input, select').forEach(el => {
    if(el.type !== 'radio' && el.type !== 'file') el.value ='';
    if (el.type === 'radio'){
     el.name = el.name.replace(/_\d+$/,`${contadorPets}`);
     el.checked = false
    }
    });
  pets.appendChild(novoBloco)
  contadorPets++;
  }
</script>
</html>
